<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>logo preview</title>
<style>
body { margin: 0; padding: 40px; background: #f5f5f5; font-family: monospace; }
.row { display: flex; gap: 30px; align-items: center; margin-bottom: 30px; }
.label { width: 120px; font-weight: bold; }
.cell { background: white; padding: 10px; border: 1px solid #ccc; }
img.src { width: 200px; height: 285px; object-fit: contain; }
img.svg { width: 200px; height: 285px; object-fit: contain; }
.dark { background: #1a1a1a; }
.dark img { filter: invert(1); }
</style>
</head>
<body>
<h2>Logo 验证: 千问原图 vs 转换结果</h2>

<div class="row">
  <div class="label">原图 (源):</div>
  <div class="cell"><img class="src" src="source.png"></div>
  <div class="cell dark"><img class="src" src="source.png"></div>
</div>

<div class="row">
  <div class="label">v1 手工:</div>
  <div class="cell"><img class="svg" src="logo-v1.svg"></div>
  <div class="cell dark"><img class="svg" src="logo-v1.svg"></div>
</div>

<div class="row">
  <div class="label">v2 potrace:</div>
  <div class="cell"><img class="svg" src="logo-v2.svg"></div>
  <div class="cell dark"><img class="svg" src="logo-v2.svg"></div>
</div>

<div class="row">
  <div class="label">v3 精细版:</div>
  <div class="cell"><img class="svg" src="logo-v3.svg"></div>
  <div class="cell dark"><img class="svg" src="logo-v3.svg"></div>
</div>

<div class="row">
  <div class="label">v2 raw autotrace:</div>
  <div class="cell"><img class="svg" src="logo-v2-autotrace.svg"></div>
  <div class="cell dark"><img class="svg" src="logo-v2-autotrace.svg"></div>
</div>

</body>
</html>

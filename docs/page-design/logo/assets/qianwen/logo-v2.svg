<?xml version="1.0" encoding="UTF-8"?>
<!--
  qianwen 双鱼太极 logo — v2 (阴鱼版 + 水滴形白鱼眼)
  来源: 基于 logo.svg (v1 双鱼版) 改造
  用户 2026-08-01 需求迭代:
    v2.1: 制造负空间, 只保留阴鱼
    v2.2: 简单去掉白鱼的线条, 仅保留白鱼头部的黑点
    v2.3: "保留的黑点很奇怪, 不是原来白鱼头部的黑点而是重新画了一个椭圆,
          两者差异巨大, 白鱼的黑点是一个水滴形状的"
          → 修正: 不再用数学 ellipse, 改用 potrace 路径里的真实水滴形几何 (path[2])

  设计意图:
    - 只保留阴鱼 (黑鱼): 黑鱼身/黑鱼右鳍/黑鱼尾/黑鱼身装饰鳍线
    - 阳鱼身/鳍/尾/装饰线 全部删除, 露出背景色 → 制造「负空间」效果
    - 保留白鱼眼 — 真实的水滴形 (来自原图, potrace 追踪的几何, 不是数学椭圆)

  与 logo.svg (v1) 的差异:
    - 删除 path[1] 白鱼身/白鱼鳍/白鱼尾
    - 删除 path[5] 白鱼身装饰小鳍线
    - 保留 path[2] 白鱼眼 (水滴形 M4054 7819 ...)
    - 保留 path[0] 黑鱼身主轮廓
    - 保留 path[3] 黑鱼右鳍/尾鳍
    - 保留 path[4] 黑鱼身装饰小鳍线
    - 不加任何 ellipse (之前 v2 错误地加了数学椭圆, 已修正)

  关键教训 (已写进 memory):
    - 不要用数学形状 (ellipse/circle) 替代 potrace 路径里的有机几何
    - potrace path[2] 整条就是白鱼眼 (一个 sub-path), 不是鱼身轮廓线
-->

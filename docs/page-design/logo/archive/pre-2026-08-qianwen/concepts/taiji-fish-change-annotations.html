<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太极双鱼改动区域标注 Demo</title>
<style>
  :root {
    --bg: #181a1f;
    --surface: #24272e;
    --fg: #f1f3f5;
    --muted: #a6adb8;
    --line: #ff6b5f;
    --line-soft: rgba(255, 107, 95, 0.14);
    --border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  main { width: min(1080px, 100%); margin: 0 auto; }
  h1 { margin: 0 0 10px; font-size: 28px; }
  .intro { margin: 0 0 28px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .board {
    display: grid;
    grid-template-columns: minmax(460px, 1.15fr) minmax(280px, 0.85fr);
    gap: 24px;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .figure { min-width: 0; }
  .figure svg { display: block; width: 100%; height: auto; }
  .notes { display: grid; align-content: center; gap: 14px; }
  .note {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 10px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.14);
  }
  .number {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--line);
    color: #17191e;
    font-weight: 800;
  }
  .note strong { display: block; margin-bottom: 4px; font-size: 14px; }
  .note p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .scope {
    margin-top: 18px;
    padding: 12px 14px;
    border-left: 3px solid var(--line);
    background: var(--line-soft);
    color: var(--muted);
    font-size: 13px;
  }
  @media (max-width: 820px) {
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>太极双鱼改动区域标注</h1>
  <p class="intro">基于水墨双鱼形态制作的 SVG 近似示意，仅用于确认三处修改位置与意图，不是最终 LOGO。</p>

  <section class="board" aria-label="太极双鱼三处改动标注">
    <div class="figure">
      <svg viewBox="0 0 620 620" role="img" aria-labelledby="demo-title demo-desc">
        <title id="demo-title">太极双鱼改动位置</title>
        <desc id="demo-desc">红色编号一至三分别标出黑鱼中间白色、白鱼尾部黑色和白鱼尾端分叉区域。</desc>
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.22"/>
          </filter>
        </defs>

        <circle cx="310" cy="310" r="238" fill="#f5f5f2" stroke="#111318" stroke-width="8" filter="url(#shadow)"/>

        <!-- 黑鱼：上半环抱，保留中部白色待改区 -->
        <path d="M 104 350 C 84 235 145 120 255 82 C 375 40 497 104 536 211 C 566 294 533 365 468 397 C 397 432 337 394 322 339 C 305 277 346 223 399 215 C 340 171 267 165 211 201 C 157 235 126 291 128 355 Z" fill="#111318"/>
        <path d="M 295 188 C 344 171 393 181 426 215 C 386 210 350 228 329 260 C 307 292 304 329 321 359 C 275 329 255 277 268 233 C 273 216 282 201 295 188 Z" fill="#f5f5f2"/>
        <circle cx="432" cy="268" r="18" fill="#f5f5f2"/>
        <path d="M 117 352 C 78 328 51 298 39 264 C 77 279 112 303 139 330 Z" fill="#111318"/>
        <path d="M 121 362 C 79 372 48 392 29 424 C 73 420 113 405 146 378 Z" fill="#111318"/>

        <!-- 白鱼：下半环抱，尾部暂有黑块和分叉待改区 -->
        <path d="M 516 269 C 536 385 475 500 365 538 C 245 580 123 516 84 409 C 54 326 87 255 152 223 C 223 188 283 226 298 281 C 315 343 274 397 221 405 C 280 449 353 455 409 419 C 463 385 494 329 492 265 Z" fill="#f5f5f2" stroke="#111318" stroke-width="5"/>
        <circle cx="188" cy="352" r="18" fill="#111318"/>
        <path d="M 500 264 C 541 238 574 211 592 180 C 547 186 509 202 478 229 Z" fill="#111318"/>
        <path d="M 500 274 C 546 277 581 291 606 318 C 561 324 519 313 482 290 Z" fill="#f5f5f2" stroke="#111318" stroke-width="5"/>
        <path d="M 484 275 C 527 258 559 258 589 268" fill="none" stroke="#111318" stroke-width="10" stroke-linecap="round"/>

        <!-- 标注 1 -->
        <circle cx="307" cy="258" r="70" fill="none" stroke="#ff6b5f" stroke-width="4" stroke-dasharray="9 8"/>
        <path d="M 250 215 L 160 128 L 112 128" fill="none" stroke="#ff6b5f" stroke-width="4" stroke-linecap="round"/>
        <circle cx="88" cy="128" r="22" fill="#ff6b5f"/>
        <text x="88" y="136" text-anchor="middle" font-size="23" font-weight="800" fill="#17191e">1</text>

        <!-- 标注 2 -->
        <ellipse cx="537" cy="220" rx="66" ry="53" fill="none" stroke="#ff6b5f" stroke-width="4" stroke-dasharray="9 8"/>
        <path d="M 575 177 L 590 111" fill="none" stroke="#ff6b5f" stroke-width="4" stroke-linecap="round"/>
        <circle cx="594" cy="86" r="22" fill="#ff6b5f"/>
        <text x="594" y="94" text-anchor="middle" font-size="23" font-weight="800" fill="#17191e">2</text>

        <!-- 标注 3 -->
        <ellipse cx="548" cy="289" rx="67" ry="48" fill="none" stroke="#ff6b5f" stroke-width="4" stroke-dasharray="9 8"/>
        <path d="M 576 327 L 592 393" fill="none" stroke="#ff6b5f" stroke-width="4" stroke-linecap="round"/>
        <circle cx="598" cy="418" r="22" fill="#ff6b5f"/>
        <text x="598" y="426" text-anchor="middle" font-size="23" font-weight="800" fill="#17191e">3</text>
      </svg>
    </div>

    <div class="notes">
      <article class="note">
        <span class="number">1</span>
        <div>
          <strong>黑鱼中间白色部分改黑</strong>
          <p>将圈出的白色负形填成黑色，使黑鱼主体保持连续。</p>
        </div>
      </article>
      <article class="note">
        <span class="number">2</span>
        <div>
          <strong>白鱼尾部黑色改白</strong>
          <p>将白鱼尾部圈出的黑色块改为白色，颜色与白鱼主体统一。</p>
        </div>
      </article>
      <article class="note">
        <span class="number">3</span>
        <div>
          <strong>白鱼鳍／尾端取消分叉</strong>
          <p>收拢圈出的分叉造型，改成与黑鱼尾端相同的连续、单向笔带。</p>
        </div>
      </article>
    </div>
  </section>

  <p class="scope">范围说明：本页只确认修改区域和方向；曲线、比例、笔触与最终配色均未定稿。</p>
</main>
</body>
</html>

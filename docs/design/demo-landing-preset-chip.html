<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing — 预设选择 Chip</title>
<style>
  :root {
    --bg: #1a1b1f;
    --surface: #272830;
    --surface-hover: #2e2f3a;
    --text: #f7f8fc;
    --text-secondary: #a8a8b5;
    --accent: #4f8ef7;
    --accent-hover: #6ba0f9;
    --border: rgba(255,255,255,0.08);
    --border-focus: rgba(79,142,247,0.5);
    --radius-sm: 3px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    gap: 60px;
  }

  .demo-title {
    font-size: 14px;
    color: var(--text-secondary);
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ── Composer Container ── */
  .composer-wrap {
    width: 100%;
    max-width: 640px;
  }

  /* ── Composer Input ── */
  .composer-input {
    width: 100%;
    min-height: 80px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }
  .composer-input::placeholder {
    color: var(--text-secondary);
    opacity: 0.6;
  }
  .composer-input:focus {
    border-color: var(--border-focus);
  }

  /* ── Chip Bar ── */
  .chip-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    align-items: center;
  }

  .info-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 500;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    white-space: nowrap;
    user-select: none;
  }
  .info-chip .chip-icon {
    font-size: 13px;
    line-height: 1;
  }

  /* ── Preset Trigger Chip ── */
  .preset-trigger {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 500;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    white-space: nowrap;
  }
  .preset-trigger:hover {
    background: var(--surface-hover);
    border-color: rgba(255,255,255,0.14);
    color: var(--text);
  }
  .preset-trigger.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(79,142,247,0.08);
  }
  .preset-trigger.locked {
    cursor: default;
    opacity: 0.7;
  }
  .preset-trigger .dropdown-arrow {
    font-size: 10px;
    opacity: 0.5;
    transition: transform 0.2s;
  }
  .preset-trigger.active .dropdown-arrow {
    transform: rotate(180deg);
  }
  .preset-trigger.locked .dropdown-arrow {
    display: none;
  }

  /* ── Popover ── */
  .popover {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    min-width: 280px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
    transition: all 0.18s ease;
    z-index: 50;
  }
  .popover.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .popover-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 10px 4px;
  }

  /* ── Preset Option ── */
  .preset-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background 0.12s;
  }
  .preset-option:hover {
    background: var(--surface-hover);
  }
  .preset-option.selected {
    background: rgba(79,142,247,0.08);
  }
  .radio-circle {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.12s;
  }
  .radio-circle::after {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    transform: scale(0);
    transition: transform 0.12s;
  }
  .preset-option.selected .radio-circle {
    border-color: var(--accent);
  }
  .preset-option.selected .radio-circle::after {
    transform: scale(1);
  }
  .preset-info {
    flex: 1;
    min-width: 0;
  }
  .preset-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .preset-name .preset-icon {
    font-size: 14px;
    line-height: 1;
  }
  .preset-description {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ── Popover Divider ── */
  .popover-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 6px;
  }

  /* ── Set Default ── */
  .set-default-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    user-select: none;
  }
  .set-default-row:hover .check-box {
    border-color: rgba(255,255,255,0.2);
  }
  .check-box {
    width: 16px;
    height: 16px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .set-default-row.checked .check-box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check-box svg {
    width: 10px;
    height: 10px;
    stroke: var(--bg);
    stroke-width: 3;
    fill: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .set-default-row.checked .check-box svg {
    opacity: 1;
  }
  .set-default-label {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ── State Toggle ── */
  .state-toggle {
    display: flex;
    gap: 4px;
    margin-top: 12px;
    justify-content: center;
  }
  .state-btn {
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .state-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
  }
  .state-btn.active {
    background: rgba(79,142,247,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Lock Tooltip ── */
  .lock-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    z-index: 50;
  }
  .preset-trigger.locked:hover .lock-tooltip {
    opacity: 1;
  }

  /* ── Responsive ── */
  @media (max-width: 520px) {
    .chip-bar { gap: 4px; }
    .preset-trigger, .info-chip { padding: 4px 8px; font-size: 11px; }
    .popover { min-width: 240px; }
  }
</style>
</head>
<body>

<div class="demo-title">Landing Page — Preset Chip</div>

<!-- ════ State 1: New Session ════ -->
<div class="composer-wrap" id="newSessionDemo">
  <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;text-align:center;">状态 1：新建 Session — 可选择预设</div>
  <textarea class="composer-input" placeholder="输入消息..." readonly></textarea>
  <div class="chip-bar">
    <div class="info-chip"><span class="chip-icon">&#x1F4C1;</span> ~/Code/xyz-agent</div>
    <div class="info-chip"><span class="chip-icon">&#x26A1;</span> Claude Sonnet 4</div>
    <div class="info-chip"><span class="chip-icon">&#x1F9E0;</span> High</div>
    <!-- Preset Trigger -->
    <div class="preset-trigger" id="presetTrigger" onclick="togglePopover()">
      <span class="chip-icon" id="triggerIcon">🔧</span>
      <span id="triggerName">全工具模式</span>
      <span class="dropdown-arrow">▾</span>
      <!-- Popover -->
      <div class="popover" id="popover">
        <div class="popover-label">选择启动预设</div>
        <div id="presetList"></div>
        <div class="popover-divider"></div>
        <div class="set-default-row" id="setDefaultRow" onclick="toggleSetDefault(event)">
          <div class="check-box"><svg viewBox="0 0 12 12"><polyline points="2 6 5 9 10 3"/></svg></div>
          <span class="set-default-label">设为默认</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ════ State 2: Existing Session (Locked) ════ -->
<div class="composer-wrap">
  <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;text-align:center;">状态 2：已有 Session — 锁定状态</div>
  <textarea class="composer-input" placeholder="继续对话..." readonly></textarea>
  <div class="chip-bar">
    <div class="info-chip"><span class="chip-icon">&#x1F4C1;</span> ~/Code/xyz-agent</div>
    <div class="info-chip"><span class="chip-icon">&#x26A1;</span> Claude Sonnet 4</div>
    <div class="info-chip"><span class="chip-icon">&#x1F9E0;</span> High</div>
    <!-- Locked Preset Chip -->
    <div class="preset-trigger locked" onclick="showLockedHint(this)">
      <span class="chip-icon">🔒</span>
      <span>Orchestrator</span>
      <div class="lock-tooltip">此 Session 使用 Orchestrator 模式创建，不可更改</div>
    </div>
  </div>
</div>

<!-- State Toggle (for demo convenience) -->
<div class="state-toggle">
  <button class="state-btn active" onclick="setState('new')">新建 Session</button>
  <button class="state-btn" onclick="setState('locked')">已有 Session</button>
</div>

<script>
// ── Data ──
const PRESETS = [
  { id: 'builtin:full', name: '全工具模式', icon: '🔧', description: '所有工具可用，适合大部分任务', builtin: true },
  { id: 'builtin:orchestrator', name: 'Orchestrator', icon: '🎯', description: '主 Agent 只做协调，SubAgent 执行，需要 subagent/workflow 扩展', builtin: true },
  { id: 'builtin:readonly', name: '只读模式', icon: '👁', description: '只能查看代码，适合 Code Review', builtin: true },
];

let selectedId = 'builtin:full';
let isSetDefault = false;
let popoverOpen = false;

// ── Render Preset List ──
function renderPresetList() {
  const list = document.getElementById('presetList');
  list.innerHTML = '';
  PRESETS.forEach(p => {
    const opt = document.createElement('div');
    opt.className = 'preset-option' + (p.id === selectedId ? ' selected' : '');
    opt.onclick = (e) => { e.stopPropagation(); selectPreset(p.id); };
    opt.innerHTML = `
      <div class="radio-circle"></div>
      <div class="preset-info">
        <div class="preset-name"><span class="preset-icon">${p.icon}</span>${p.name}</div>
        <div class="preset-description">${p.description}</div>
      </div>
    `;
    list.appendChild(opt);
  });
}

// ── Actions ──
function togglePopover() {
  popoverOpen = !popoverOpen;
  const pop = document.getElementById('popover');
  const trigger = document.getElementById('presetTrigger');
  pop.classList.toggle('open', popoverOpen);
  trigger.classList.toggle('active', popoverOpen);
}

function selectPreset(id) {
  selectedId = id;
  const p = PRESETS.find(x => x.id === id);
  document.getElementById('triggerIcon').textContent = p.icon;
  document.getElementById('triggerName').textContent = p.name;
  renderPresetList();
  // close popover after selection
  popoverOpen = false;
  document.getElementById('popover').classList.remove('open');
  document.getElementById('presetTrigger').classList.remove('active');
}

function toggleSetDefault(e) {
  e.stopPropagation();
  isSetDefault = !isSetDefault;
  document.getElementById('setDefaultRow').classList.toggle('checked', isSetDefault);
}

function showLockedHint(el) {
  // tooltip is CSS-only (:hover), this just prevents any other action
}

function setState(state) {
  const btns = document.querySelectorAll('.state-btn');
  btns.forEach((b, i) => b.classList.toggle('active', i === (state === 'new' ? 0 : 1)));
}

// Close popover on outside click
document.addEventListener('click', (e) => {
  if (popoverOpen && !document.getElementById('presetTrigger').contains(e.target)) {
    popoverOpen = false;
    document.getElementById('popover').classList.remove('open');
    document.getElementById('presetTrigger').classList.remove('active');
  }
});

// ── Init ──
renderPresetList();
</script>

</body>
</html>

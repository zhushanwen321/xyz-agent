name: Release NPM

# npm 包发布（与 Electron 打包 release.yml 解耦）
#
# 触发方式：
#   1. push tag `npm-*` — 正式发布（main 稳定发布线，tag 格式 `npm-<slug>-<date>-<time>`，见 docs/...）
#   2. workflow_dispatch — 手动触发
#
# 注意：Electron 打包走 `v*` tag 前缀（release.yml），npm 走 `npm-*`，两套互不干扰。
# dev-npm 预发布走另一条线（release-npm-dev.yml + changeset pre），与本 workflow 独立。

on:
  push:
    tags:
      - 'npm-*'
  workflow_dispatch:

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # 只在 tag 推送或手动触发时运行（不在 PR 中运行）
    if: startsWith(github.ref, 'refs/tags/npm-') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # 防御：main 稳定发布线绝不能在 prerelease 模式下跑。
      # changeset publish() 首行 readPreState() 读 .changeset/pre.json，存在则把整批发到 dev dist-tag。
      # 若 npm-prerelease.sh 还原失败（阶段 6 未执行）致 pre.json 残留 main，这里必须拦住。
      # 与 release-npm-dev.yml 的“检查 pre.json 存在才发”对称（那条线检查存在，本线检查不存在）。
      - name: Verify NOT in prerelease mode
        run: |
          if [ -f ".changeset/pre.json" ]; then
            echo "::error::.changeset/pre.json 存在 — main 稳定发布不能在 prerelease 模式下运行。"
            echo "这通常是 npm-prerelease.sh 还原失败（阶段 6 未执行）导致 pre.json 残留 main。"
            echo "本地执行 \`pnpm changeset pre exit\` 并提交删除，或删掉 .changeset/pre.json 后重新触发。"
            exit 1
          fi
          echo "No .changeset/pre.json — stable release mode confirmed."

      - name: Build extension-protocol
        run: pnpm --filter @xyz-agent/extension-protocol build

      - name: Build session-delivery
        run: pnpm --filter @xyz-agent/session-delivery build

      # MF-4 防线：发布前 typecheck gate（与 Electron 线 pre-commit validate-runtime-bundle.sh 同级）。
      # 历史教训：无 gate 时 TS 编译错误直接随源码发布成坏包（pi-ask-user@4.0.0 ESM 加载即崩）。
      - name: Typecheck extensions
        run: pnpm extensions:typecheck

      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## NPM Publish Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published all packages with pending changesets to npm." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This includes:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`@xyz-agent/extension-protocol\` (builds dist)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`@xyz-agent/session-delivery\` (builds dist)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`@zhushanwen/pi-*\` extensions (publishes TS source, no build)" >> "$GITHUB_STEP_SUMMARY"

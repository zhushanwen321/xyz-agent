name: GitCode Sync Probe

# GitCode Release 写路径探针（手动触发）：创建探针 release → 上传附件 → 匿名下载回读
# → 自动清理。用于正式把 sync job 挂进 release.yml 之前验证 GitCode 写链路；
# 通过后本 workflow 仅在排查 GitCode 同步问题时手动使用。
# 依赖：secret GITCODE_TOKEN（GitCode 私人令牌）；输入 GITCODE_REPO（GitCode 仓库路径 owner/repo）。

on:
  workflow_dispatch:
    inputs:
      gitcode_repo:
        description: 'GitCode 仓库路径（owner/repo，需已在 GitCode 建好）'
        required: true
        type: string
      probe_large_file:
        description: '追加 200MB 大文件上传验证（验证单附件大小上限，耗时几分钟）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gitcode-sync-probe
  cancel-in-progress: false

jobs:
  probe:
    name: GitCode write-path probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Run GitCode sync probe
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: ${{ inputs.gitcode_repo }}
        run: |
          set -euo pipefail
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "::error::secret GITCODE_TOKEN 未配置 —— 仓库 Settings → Secrets and variables → Actions → New repository secret（Name: GITCODE_TOKEN，值: GitCode 私人令牌）后重跑"
            exit 1
          fi
          EXTRA=""
          if [ "${{ inputs.probe_large_file }}" = "true" ]; then
            EXTRA="--large"
          fi
          node scripts/gitcode-release-sync.mjs probe ${EXTRA}

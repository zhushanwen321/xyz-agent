name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.xyz-harness/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.xyz-harness/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm workspace 单步安装：根 + packages/* + apps/* 一次装完
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: TypeCheck - renderer
        run: pnpm --filter @xyz-agent/frontend run typecheck

      - name: TypeCheck - runtime
        run: pnpm --filter @xyz-agent/runtime run typecheck

      - name: TypeCheck - shared
        run: pnpm --filter @xyz-agent/shared run typecheck

      - name: TypeCheck - pi extensions
        run: pnpm extensions:typecheck

  # SDK 类型同步防漂移：runtime 的 plugin-types 是 single source of truth，
  # plugin-sdk/src/types.ts 由 sync-types.sh 自动生成。此 job 重新生成并要求
  # git diff 为空——任何对 runtime plugin-types 的改动必须同步刷新 SDK types，
  # 否则 CI 失败（防止两份文件再次漂移）。
  sdk-sync:
    name: SDK types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Check plugin-sdk types are synced with runtime
        working-directory: packages/plugin-sdk
        run: pnpm run check-sync

  # Test 拆分为 4 个并行 job（原串行 214s → 关键路径 ~120s，省 ~95s）。
  # runner 分钟数总量不变（ubuntu 充足），build gate 语义保持（任一失败不启动 build）。
  # mac 完整 main tests（updater-script-integration 的 mac 专属用例）仍由 build.yml mac 平台跑，
  # 此处 test-main 只跑 ubuntu 上能跑的子集。
  test-runtime:
    name: Test (runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @xyz-agent/runtime run test -- --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-runtime
          path: packages/runtime/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  test-renderer:
    name: Test (renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @xyz-agent/frontend run test -- --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-renderer
          path: packages/renderer/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  test-main:
    name: Test (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @xyz-agent/electron run test:main

  test-extensions:
    name: Test (extensions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm extensions:test

  # PR 构建检查：electron-builder 打包流程，不在 PR 上传产物。
  # dir-only=true：只产出 unpacked 目录，跳过安装器压缩（省 ~185s）。安装器配置回归交给 release.yml。
  # needs gate：lint/typecheck/sdk-sync + 4 个 test job 任一已知失败时不浪费 mac runner（mac 构建 5-8min）。
  build:
    name: Build
    needs: [lint, typecheck, sdk-sync, test-runtime, test-renderer, test-main, test-extensions]
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: false
      dir-only: true

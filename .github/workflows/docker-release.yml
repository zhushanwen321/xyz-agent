# .github/workflows/docker-release.yml
# 触发条件：push v* tag（与 release.yml 平行，独立发布 Docker 镜像到 ghcr.io）
# 镜像：ghcr.io/zhushanwen321/xyz-agent-server:<version> + :latest
# Dockerfile：apps/server/Dockerfile（多阶段 build，pi npm 包 + node-pty 编译）
#
# 与 release.yml（Electron DMG/EXE/AppImage）是平行链路：
# - tag v0.8.13 push 后，release.yml 发 Electron 产物，本 workflow 发 Docker 镜像
# - 两个 workflow 独立运行，互不依赖

name: docker-release

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发（用于测试 workflow 本身，不发版）
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # ghcr.io push 必需

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（multi-arch）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata（tags + labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zhushanwen321/xyz-agent-server
          tags: |
            # v0.8.13 → 0.8.13
            type=semver,pattern={{version}}
            # v0.8.13 → 0.8
            type=semver,pattern={{major}}.{{minor}}
            # latest
            type=semver,pattern=latest
            # workflow_dispatch 时用 git short sha
            type=sha,prefix=sha-,format=short

      - name: Build and push（multi-arch）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

appId: com.xyz-agent.app
productName: xyz-agent
# electron-builder 在 linux AppImage 上 fallback 用 package.json name（@xyz-agent/electron）
# 去斜杠后变成 @xyz-agentelectron，AppImage 拒绝 @ 字符。显式指定与 productName 一致，
# mac/linux/win 三平台统一。mac 产物验证：Contents/MacOS/xyz-agent（改动前已是此值，无行为变化）。
executableName: xyz-agent
directories:
  output: dist/builder-output
asar: true
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/runtime/**/*   # asarUnpack 的前提：files 必须先包含，才能 unpack
  # renderer 产物：packages/renderer build 输出到 apps/electron/renderer/dist
  #（vite.config.ts build.outDir），main 进程 loadFile('renderer/dist/index.html') 依赖此路径
  - renderer/dist/**/*
  - package.json
  # ══════════════════════════════════════════════════════════════
  # files 规则（违反导致打包膨胀或缺文件）
  # ──────────────────────────────────────────────────────────────
  # 只打包主进程直接 require 的包；其余已被 tsup bundle 进 runtime
  # 新增主进程依赖时必须同步更新此列表
  # 检查：scripts/preflight-check.sh
  # ══════════════════════════════════════════════════════════════
  - node_modules/electron-store/**/*
  - node_modules/is-glob/**/*
  - node_modules/markdown-it-footnote/**/*
  - node_modules/@types/markdown-it-footnote/**/*
  # node-pty（native module）：runtime 通过 external 引用，必须打包进产物。
  # native binary（.node + spawn-helper）靠 asarUnpack 解包，子进程才能加载。
  - node_modules/node-pty/**/*
  # 排除
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.ts"
  # 警告：asarUnpack 只作用于已被 files 包含的文件。
  # 如果在此排除 dist/runtime，asarUnpack 将无文件可解压，
  # 导致打包产物中缺失整个 runtime，应用启动即崩溃。
  # 历史回归：2026-05-31 因添加 '!dist/runtime/**/*' 导致 0.3.8 DMG 无法启动。
  - "!dist/builder-output/**/*"

# runtime 预编译产物必须排除在 asar 之外，
# 因为 Node.js 子进程无法直接读取 asar 内的文件。
# 关键约束：asarUnpack 只作用于已被 files 包含的文件。
# dist/runtime 必须在 files 中存在，然后 asarUnpack 会把它从 asar
# 中剔除到 app.asar.unpacked/ 目录。如果 files 排除了 dist/runtime，
# 这里只会静默失败，产物中不会有 app.asar.unpacked/dist/runtime/。
# 检查：scripts/preflight-check.sh [6/8] asarUnpack vs files consistency
asarUnpack:
  - "dist/runtime/**/*"
  # node-pty native binary（prebuilds/<platform>/pty.node + spawn-helper）
  # 必须解包到 app.asar.unpacked，子进程（runtime）才能 require .node 和 exec spawn-helper。
  # spawn-helper 需 +x 权限（见 scripts/fix-node-pty-permissions.sh，postinstall 自动修）。
  - "node_modules/node-pty/**/*"

# pi Bun binary + bundled agent (extensions + skills)
# from 路径相对于 apps/electron/（electron-builder 的工作目录）
extraResources:
  - from: resources/pi
    to: pi
    filter:
      - "**/*"
      - "!**/*.tar.gz"
      - "!**/*.zip"
  # xyz-agent pi extension (xyz-navigate command)
  # 源文件在 repo root。electron-builder projectDir=apps/electron/，
  # from 相对 projectDir 解析，需上两级到仓库根。
  # 注：builtin pi-extensions（@zhushanwen/pi-*）已改为 Settings 推荐安装，
  # 不再打包进产物。详见 recommended-extensions.json + extension.recommended WS 协议。
  - from: ../../xyz-agent-extension.js
    to: xyz-agent-extension.js
  # xyz-system-prompt-extension.js（before_agent_start hook：追加注入 + 快照）
  # 同 xyz-agent-extension.js，源文件在 repo root，from 需上两级。
  - from: ../../xyz-system-prompt-extension.js
    to: xyz-system-prompt-extension.js
  # xyz-agent runtime bundle（tsup 打包产物）
  # T1 把 runtime tsup outDir 从 apps/electron/dist/runtime 收回到 packages/runtime/dist，
  # 但 electron-builder projectDir=apps/electron/，files/asarUnpack 的产物内部路径
  # `dist/runtime/**/*` 视野看不到 packages/runtime/dist——靠 extraResources 把 4 个 bundle
  # （index.cjs / plugin-bootstrap.cjs / cli.cjs / server.cjs）拷到产物内部 dist/runtime/，
  # 让 files/asarUnpack 命中，process-control.ts 的 app.asar.unpacked/dist/runtime/index.cjs 不变。
  # from 相对 apps/electron/，需上两级到 packages/runtime/dist。
  - from: ../../packages/runtime/dist
    to: dist/runtime
    filter:
      - "**/*"
  # xyz-client-msg-id-mapper.js（input hook 剥 prompt 标记 + appendEntry 写 clientUuid↔userEntryId 映射）
  # 客户端 message 元数据映射框架：重开 session 时按映射回填 image/file badge。同前两个 extension 模式。
  - from: ../../xyz-client-msg-id-mapper.js
    to: xyz-client-msg-id-mapper.js
  # xyz-settings CLI（从 tsup 打包的 cli.cjs，与 runtime 同源但单独拷贝）
  # packaged app 中位置：resources/bin/xyz-settings
  # pi Skill 通过绝对路径引用此文件
  - from: ../../packages/runtime/dist/cli.cjs
    to: bin/xyz-settings

# NOTE: macos-latest 是 arm64 runner，无法交叉编译 x64。
# 如需 Intel Mac 支持，追加 macos-13 (Intel) 或配置 universal。
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  minimumSystemVersion: 12.0.0
  # 固定文件名（去 ${version}）支持自动升级 + releases/latest/download 静态 URL。
  # zip 和 dmg 共用此 pattern，${ext} 由 electron-builder 按 target 解析为 .zip / .dmg。
  artifactName: xyz-agent-mac-arm64.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # 固定文件名（去 ${version}）支持自动升级 + releases/latest/download 静态 URL。
  # nsis target 的 ${ext} 解析为 exe，zip target 的 ${ext} 解析为 zip。
  artifactName: xyz-agent-setup-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: xyz-agent-setup-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  # 固定文件名（去 ${version}）支持自动升级 + releases/latest/download 静态 URL。
  # ${arch} 由 electron-builder 按 target ext 解析（getArtifactArchName）：
  # AppImage(x64) -> x86_64，deb(x64) -> amd64，${ext} 解析为 AppImage / deb。
  # 产物：xyz-agent-x86_64.AppImage 和 xyz-agent-amd64.deb。
  artifactName: xyz-agent-${arch}.${ext}

# 本地构建时 electron-builder 需要至少一个 publish provider
# 否则 updateInfoBuilder 会因 channel === null 崩溃
# CI release workflow 会覆盖此配置
publish:
  provider: generic
  url: https://localhost/local-only

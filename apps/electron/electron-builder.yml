appId: com.xyz-agent.app
productName: 太极
# electron-builder 在 linux AppImage 上 fallback 用 package.json name（@xyz-agent/electron）
# 去斜杠后变成 @xyz-agentelectron，AppImage 拒绝 @ 字符，故显式指定。
# executableName / artifactName 统一用 TaiJi（拼音），与 productName「太极」品牌一致：
# - 用拼音而非中文：可执行文件名 / 下载包名含中文有路径编码与跨工具链风险，拼音零风险。
# - 不考虑 ≤0.8.40 旧版本自动升级兼容（旧版需手动下载新版重装），故 artifactName 可直接改名；
#   release-checker.ts ASSET_NAME / postbuild-validate.sh / README 下载指引已同步改为 TaiJi-*。
executableName: TaiJi
directories:
  output: dist/builder-output
asar: true
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/runtime/**/*   # asarUnpack 的前提：files 必须先包含，才能 unpack
  # renderer 产物：packages/renderer build 输出到 apps/electron/renderer/dist
  #（vite.config.ts build.outDir），main 进程 loadFile('renderer/dist/index.html') 依赖此路径
  - renderer/dist/**/*
  - package.json
  # ══════════════════════════════════════════════════════════════
  # files 规则（违反导致打包膨胀或缺文件）
  # ──────────────────────────────────────────────────────────────
  # 只打包主进程直接 require 的包；其余已被 tsup bundle 进 runtime
  # 新增主进程依赖时必须同步更新此列表
  # 检查：scripts/preflight-check.sh
  # ══════════════════════════════════════════════════════════════
  - node_modules/electron-store/**/*
  - node_modules/is-glob/**/*
  - node_modules/markdown-it-footnote/**/*
  - node_modules/@types/markdown-it-footnote/**/*
  # node-pty（native module）：runtime 通过 external 引用，必须打包进产物。
  # native binary（.node + spawn-helper）靠 asarUnpack 解包，子进程才能加载。
  - node_modules/node-pty/**/*
  # 排除
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.ts"
  # 警告：asarUnpack 只作用于已被 files 包含的文件。
  # 如果在此排除 dist/runtime，asarUnpack 将无文件可解压，
  # 导致打包产物中缺失整个 runtime，应用启动即崩溃。
  # 历史回归：2026-05-31 因添加 '!dist/runtime/**/*' 导致 0.3.8 DMG 无法启动。
  - "!dist/builder-output/**/*"

# runtime 预编译产物必须排除在 asar 之外，
# 因为 Node.js 子进程无法直接读取 asar 内的文件。
# 关键约束：asarUnpack 只作用于已被 files 包含的文件。
# dist/runtime 必须在 files 中存在，然后 asarUnpack 会把它从 asar
# 中剔除到 app.asar.unpacked/ 目录。如果 files 排除了 dist/runtime，
# 这里只会静默失败，产物中不会有 app.asar.unpacked/dist/runtime/。
# 检查：scripts/preflight-check.sh [6/8] asarUnpack vs files consistency
asarUnpack:
  - "dist/runtime/**/*"
  # node-pty native binary（prebuilds/<platform>/pty.node + spawn-helper）
  # 必须解包到 app.asar.unpacked，子进程（runtime）才能 require .node 和 exec spawn-helper。
  # spawn-helper 需 +x 权限（见 scripts/fix-node-pty-permissions.sh，postinstall 自动修）。
  - "node_modules/node-pty/**/*"

# pi Bun binary + bundled agent (extensions + skills)
# from 路径相对于 apps/electron/（electron-builder 的工作目录）
extraResources:
  - from: resources/pi
    to: pi
    filter:
      - "**/*"
      - "!**/*.tar.gz"
      - "!**/*.zip"
  # xyz-agent pi extension (xyz-navigate command)
  # 源文件在 repo root。electron-builder projectDir=apps/electron/，
  # from 相对 projectDir 解析，需上两级到仓库根。
  # 注：builtin pi-extensions（@zhushanwen/pi-*）打包内置（2026-08 重构），
  # 由下方 resources/extensions 条目拷贝，不走 Settings 推荐安装（旧机制已废弃）。
  # builtin pi extensions（@zhushanwen/pi-* 包，数量以 mandatory-extensions.json SSOT 为准，
  # 打包内置，不走 npm install）
  # prepare-builtin-extensions.sh 预先 deploy 到 resources/extensions/@zhushanwen/<pkg>/
  # 含真实运行时 deps（tree-sitter-bash/ajv/croner 等），不含 peerDeps（pi 进程提供）
  - from: resources/extensions
    to: extensions
    filter:
      - "**/*"
      # 排除 tree-sitter-bash 的 C 源码 + grammar（产物不需要，省 10M）
      - "!**/tree-sitter-bash/src/**"
      - "!**/tree-sitter-bash/grammar.js"
      # 排除 web-tree-sitter 的 debug wasm（804K，非运行时需要）
      - "!**/web-tree-sitter/debug/**"
      # 排除测试 + 类型声明（运行时不需要）
      - "!**/__tests__/**"
      - "!**/*.test.*"
      - "!**/*.d.ts"
  # built-in xyz plugins（resources/plugins/<name>，如 statusline）。
  # prepare-builtin-plugins.sh 预编译 index.ts → index.js（与源同目录）；plugin-registry
  # 打包后扫描 <cwd>/resources/plugins（cwd=Resources），故 to 保持 resources/plugins 嵌套。
  # 排除 .ts 源码（运行时不需要，防体积浪费；入口以 manifest main 的 index.js 为准）。
  - from: ../../resources/plugins
    to: resources/plugins
    filter:
      - "**/*"
      - "!**/*.ts"
  # xyz-settings CLI（从 tsup 打包的 cli.cjs）
  # packaged app 中位置：resources/bin/xyz-settings
  # pi Skill 通过绝对路径引用此文件
  - from: dist/runtime/cli.cjs
    to: bin/xyz-settings

# NOTE: macos-latest 是 arm64 runner，无法交叉编译 x64。
# 如需 Intel Mac 支持，追加 macos-13 (Intel) 或配置 universal。
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  minimumSystemVersion: 12.0.0
  # release asset 文件名带版本号（preflight 检查强制；release-checker 用平台后缀 pattern
  # 如 -mac-arm64.zip 定位 asset，不依赖固定文件名——ad0bcf86a 起自动升级改走版本化 asset）。
  # zip 和 dmg 共用此 pattern，${ext} 由 electron-builder 按 target 解析为 .zip / .dmg。
  artifactName: TaiJi-${version}-mac-arm64.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  # release asset 文件名带版本号（同 mac 注释，release-checker pattern 匹配）。
  # nsis target 的 ${ext} 解析为 exe，zip target 的 ${ext} 解析为 zip。
  # [HISTORICAL] 版本号必须在 setup 之前（TaiJi-<v>-setup-<arch>.exe）：release-checker
  # ASSET_PATTERNS.winX64Exe 用 '-setup-x64.exe' 后缀匹配，setup 在 version 前会导致
  # win 自动升级检测永远匹配不到 release asset（M7-01 P0）。
  artifactName: TaiJi-${version}-setup-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: TaiJi-${version}-setup-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: build/icon-512.png
  # release asset 文件名带版本号（同 mac 注释，release-checker pattern 匹配）。
  # ${arch} 由 electron-builder 按 target ext 解析（getArtifactArchName）：
  # AppImage(x64) -> x86_64，deb(x64) -> amd64，${ext} 解析为 AppImage / deb。
  # 产物：TaiJi-${version}-x86_64.AppImage 和 TaiJi-${version}-amd64.deb。
  artifactName: TaiJi-${version}-${arch}.${ext}

# 本地构建时 electron-builder 需要至少一个 publish provider
# 否则 updateInfoBuilder 会因 channel === null 崩溃
# CI release workflow 会覆盖此配置
publish:
  provider: generic
  url: https://localhost/local-only
